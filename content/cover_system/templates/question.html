<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1440px;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;background:#121212;color:white}
.cover{position:relative;width:1080px;height:1440px;padding:82px;background:linear-gradient(160deg,#101114 0%,#18191c 58%,#29231e 100%)}
.noise{position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(255,92,62,.5),transparent 24%),radial-gradient(circle at 0% 85%,rgba(255,202,70,.15),transparent 30%)}
.q{position:absolute;right:55px;top:120px;font:950 520px/1 Arial;color:rgba(255,255,255,.045)}.top{position:relative;z-index:2;display:flex;gap:18px;align-items:center}.pill{border-radius:999px;background:#ff5c3e;color:white;padding:14px 24px;font-size:27px;font-weight:800}.kicker{font-size:25px;letter-spacing:4px;font-weight:750;color:#bbb}
.main{position:relative;z-index:2;margin-top:210px}.eyebrow{font-size:34px;font-weight:800;color:#ff7b61;margin-bottom:34px}.title{font-size:112px;line-height:1.07;font-weight:950;letter-spacing:-5px;max-width:890px}.accent{margin-top:38px;display:inline-block;background:#f6ff4a;color:#101010;padding:13px 22px 16px;font-size:44px;font-weight:950;transform:rotate(-2deg)}
.sub{margin-top:58px;width:790px;color:#d8d8d8;font-size:34px;line-height:1.55;font-weight:600}.bottom{position:absolute;left:82px;right:82px;bottom:72px;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;border-top:2px solid #444;padding-top:26px;font-size:24px;color:#aaa}.mark{font-size:50px;font-weight:950;color:#fff}
</style></head><body><div class="cover"><div class="noise"></div><div class="q">?</div><div class="top"><span class="pill">{{ badge }}</span><span class="kicker">{{ kicker }}</span></div><div class="main"><div class="eyebrow">别急着照做，先看这一点</div><div class="title">{{ primary_text }}</div><div class="accent">{{ highlight_text }}</div><div class="sub">{{ secondary_text }}</div></div><div class="bottom"><span>把误区说透 · 把方法做实</span><span class="mark">↗</span></div></div></body></html>
