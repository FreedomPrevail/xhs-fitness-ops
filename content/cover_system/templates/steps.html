<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1440px;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;background:#f7f8f3;color:#152017}
.cover{position:relative;width:1080px;height:1440px;padding:82px;background:linear-gradient(135deg,#f8f8f2,#e9f1df)}
.cover:before{content:"";position:absolute;right:-120px;bottom:-80px;width:620px;height:620px;border-radius:140px;background:#b9f542;transform:rotate(18deg)}.cover:after{content:"";position:absolute;right:60px;bottom:90px;width:380px;height:380px;border:5px solid rgba(21,32,23,.16);border-radius:100%;}
.top{position:relative;z-index:2;display:flex;justify-content:space-between}.kicker{font-size:27px;font-weight:850;letter-spacing:4px}.badge{font-size:25px;background:#162019;color:white;border-radius:16px;padding:14px 20px}
.main{position:relative;z-index:2;margin-top:160px;width:850px}.num{font-size:220px;font-weight:950;line-height:.85;letter-spacing:-12px;color:#152017}.num small{font-size:42px;letter-spacing:0;margin-left:12px}.line{width:620px;height:5px;background:#152017;margin:42px 0}.title{font-size:94px;line-height:1.12;font-weight:950;letter-spacing:-4px}.sub{margin-top:42px;font-size:34px;line-height:1.55;width:720px;font-weight:650;color:#465047}.tip{position:absolute;z-index:3;right:80px;bottom:100px;width:330px;padding:28px 30px;background:white;border-radius:28px;box-shadow:0 18px 40px rgba(0,0,0,.12);font-size:28px;line-height:1.45;font-weight:800;transform:rotate(-3deg)}
</style></head><body><div class="cover"><div class="top"><span class="kicker">{{ kicker }}</span><span class="badge">{{ badge }}</span></div><div class="main"><div class="num">{{ number_token }}<small>KEY</small></div><div class="line"></div><div class="title">{{ primary_text }}</div><div class="sub">{{ secondary_text }}</div></div><div class="tip">保存这张封面<br>照着做就行 ↘</div></div></body></html>
