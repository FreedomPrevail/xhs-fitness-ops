<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1440px;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;background:#f4f1ea;color:#111}
.cover{position:relative;width:1080px;height:1440px;padding:92px 84px 80px;background:linear-gradient(145deg,#f7f4ed 0%,#ebe7de 55%,#ded7cb 100%)}
.cover:before{content:"";position:absolute;right:-170px;top:-120px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7a59,transparent 63%);opacity:.9}
.cover:after{content:"";position:absolute;left:-140px;bottom:-150px;width:610px;height:610px;border-radius:44%;border:90px solid rgba(0,0,0,.055);transform:rotate(24deg)}
.top{position:relative;display:flex;justify-content:space-between;align-items:center;z-index:2}.kicker{font-size:27px;font-weight:800;letter-spacing:5px}.badge{font-size:27px;font-weight:700;padding:15px 24px;border:2px solid #111;border-radius:999px;background:rgba(255,255,255,.5)}
.main{position:relative;z-index:2;margin-top:230px;width:850px}.title{font-size:104px;line-height:1.08;font-weight:950;letter-spacing:-5px;max-width:900px}.highlight{display:inline-block;position:relative}.highlight:after{content:"";position:absolute;left:-6px;right:-6px;bottom:4px;height:22px;background:#ff6545;z-index:-1;transform:rotate(-1deg)}
.sub{margin-top:50px;font-size:36px;line-height:1.55;font-weight:600;width:760px;color:#37332f}.rule{margin-top:72px;width:180px;height:10px;border-radius:10px;background:#111}.foot{position:absolute;left:84px;right:84px;bottom:82px;display:flex;justify-content:space-between;font-size:25px;font-weight:700;letter-spacing:2px;z-index:2}.index{font-size:90px;line-height:.8;font-weight:950;opacity:.12}
</style></head><body><div class="cover"><div class="top"><div class="kicker">{{ kicker }}</div><div class="badge">{{ badge }}</div></div><div class="main"><div class="title">{{ primary_text }}</div><div class="rule"></div><div class="sub">{{ secondary_text }}</div></div><div class="foot"><span>健身 · 健康 · 理性表达</span><span class="index">01</span></div></div></body></html>
